<script>(function(){var r=document.getElementById("tsb-ev");if(!r)return;var town=null,type="all",wk=r.querySelector(".tsb-wk select");
function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
if(wk){var today=ymd(new Date()),pick=null;[].forEach.call(wk.options,function(o){if(o.value==="all")return;var p=o.value.split("-"),e=new Date(+p[0],+p[1]-1,+p[2]+7);if(o.value<=today&&today<ymd(e))pick=o.value});wk.value=pick||wk.options[0].value}
function fromHash(){var h=(location.hash||"").slice(1);if(h==="events"||h==="funding"||h==="hiring"||h==="news"||h==="network"){type=h==="events"?"event":h;town=null;apply();try{r.scrollIntoView({behavior:"smooth",block:"start"})}catch(e){}}}
function extra(){return type==="hiring"||type==="news"}
function inScope(c){var w=wk&&!extra()?wk.value:"all",s=c.closest(".week");return (type==="all"||(type==="network"?c.dataset.net==="1":c.dataset.type===type))&&(w==="all"||!s||s.dataset.week===w)}
function apply(){var counts={},fund={};r.querySelectorAll(".week .card").forEach(function(c){if(inScope(c)){counts[c.dataset.town]=(counts[c.dataset.town]||0)+1;if(c.dataset.type==="funding")fund[c.dataset.town]=(fund[c.dataset.town]||0)+1}});
if(town&&!counts[town])town=null;r.classList.toggle("oneweek",!!wk&&!extra()&&wk.value!=="all");
r.querySelectorAll(".week .card").forEach(function(c){c.hidden=!inScope(c)||(town&&c.dataset.town!==town)});
r.querySelectorAll(".week").forEach(function(w){w.hidden=!w.querySelector(".card:not([hidden])")});
r.querySelectorAll(".tsb-x").forEach(function(x){x.hidden=x.dataset.t!==type});
var mp=r.querySelector("svg.tsb-map");if(mp){mp.classList.toggle("nopins",extra());mp.classList.toggle("netonly",type==="network")}
r.querySelectorAll(".pin").forEach(function(p){var n=counts[p.dataset.town]||0;p.style.display=n?"":"none";var t=p.querySelector(".pg text");if(t)t.textContent=n;p.setAttribute("aria-label",p.dataset.town+": "+n+" event"+(n===1?"":"s"));p.classList.toggle("sel",p.dataset.town===town);var f=n&&fund[p.dataset.town]===n;p.classList.toggle("fund",!!f);var pa=p.querySelector(".pg path");if(pa)pa.setAttribute("fill",f?"#0B0D0C":"#04CF61")});
r.querySelectorAll(".pinlabel").forEach(function(l){l.style.display=counts[l.dataset.town]?"":"none"});
r.querySelectorAll(".tsb-f button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.t===type?"true":"false")});
if(wk)wk.closest(".tsb-wk").hidden=extra();
var none=r.querySelector(".tsb-none");if(none)none.hidden=extra()||!!r.querySelector(".week .card:not([hidden])");
var s=r.querySelector(".tsb-town");s.hidden=!town;s.querySelector("b").textContent=town||""}
r.addEventListener("click",function(e){var p=e.target.closest(".pin");if(p){town=town===p.dataset.town?null:p.dataset.town;apply();return}var b=e.target.closest(".tsb-f button");if(b){type=b.dataset.t;apply();return}if(e.target.closest(".tsb-clear")){e.preventDefault();town=null;apply()}});
r.addEventListener("keydown",function(e){var p=e.target.closest(".pin");if(p&&(e.key==="Enter"||e.key===" ")){e.preventDefault();town=town===p.dataset.town?null:p.dataset.town;apply()}});
if(wk)wk.addEventListener("change",function(){town=null;apply()});
window.addEventListener("hashchange",fromHash);apply();fromHash()})();</script></div>
